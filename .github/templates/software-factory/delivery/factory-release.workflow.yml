name: Factory release envelope

on:
  repository_dispatch:
    types: [factory-release]

permissions:
  actions: read
  contents: read

concurrency:
  group: factory-release-${{ github.event.client_payload.candidate_sha }}-${{ github.event.client_payload.acceptance_run_id }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.sha == vars.FACTORY_CONTROLLER_SHA }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: factory-release
    env:
      FACTORY_INPUT_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
      FACTORY_INPUT_ACCEPTANCE_RUN_ID: ${{ github.event.client_payload.acceptance_run_id }}
      FACTORY_INPUT_PACKAGE: ${{ github.event.client_payload.factory_package }}
      FACTORY_INPUT_ACCEPTANCE_PLAN: ${{ github.event.client_payload.acceptance_plan }}
      FACTORY_INPUT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
      FACTORY_INPUT_CI: ${{ github.event.client_payload.ci }}
      FACTORY_ACCEPTANCE_ROOT: ${{ runner.temp }}/factory-acceptance
      FACTORY_ACCEPTANCE_ATTESTATION: ${{ runner.temp }}/factory-acceptance-artifact-attestation.json
      FACTORY_RELEASE_ROOT: ${{ runner.temp }}/factory-release-envelope
    steps:
      - name: Checkout protected factory controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.FACTORY_CONTROLLER_SHA }}
          path: factory-controller
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Resolve exact successful acceptance run and evidence envelope
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-actions-attestation.mjs"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$FACTORY_INPUT_ACCEPTANCE_RUN_ID"
          --candidate-sha "$FACTORY_INPUT_CANDIDATE_SHA"
          --workflow-sha "$FACTORY_CONTROLLER_SHA"
          --workflow-ref ".github/workflows/factory-acceptance.yml"
          --artifact-name "factory-evidence-envelope-$FACTORY_INPUT_ACCEPTANCE_RUN_ID"
          --out "$FACTORY_ACCEPTANCE_ATTESTATION" --json
      - name: Validate protected controller, candidate and selected CI contract
        id: contract
        env:
          FACTORY_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-workflow-context.mjs"
          --controller-root "$GITHUB_WORKSPACE/factory-controller"
          --controller-sha "$FACTORY_CONTROLLER_SHA"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --candidate-sha "$FACTORY_INPUT_CANDIDATE_SHA"
          --ci "$FACTORY_INPUT_CI"
          --github-output "$GITHUB_OUTPUT" --json
      - name: Download minimized acceptance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-evidence-bundle-${{ github.event.client_payload.acceptance_run_id }}
          path: ${{ runner.temp }}/factory-acceptance
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.acceptance_run_id }}
      - name: Download acceptance evidence envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-evidence-envelope-${{ github.event.client_payload.acceptance_run_id }}
          path: ${{ runner.temp }}/factory-acceptance
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.acceptance_run_id }}
      - name: Replay gates and derive exact release-ready envelope
        env:
          FACTORY_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
          FACTORY_RELEASE_REVIEW_RECEIPT: ${{ github.event.client_payload.review_receipt_json }}
          FACTORY_REVIEW_PUBLIC_KEY_PATH: ${{ vars.FACTORY_REVIEW_PUBLIC_KEY_PATH }}
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-release.mjs"
          --root "$GITHUB_WORKSPACE/candidate"
          --controller-root "$GITHUB_WORKSPACE/factory-controller"
          --controller-sha "$FACTORY_CONTROLLER_SHA"
          --review-public-key "$FACTORY_REVIEW_PUBLIC_KEY_PATH"
          --package "$FACTORY_INPUT_PACKAGE"
          --acceptance-plan "$FACTORY_INPUT_ACCEPTANCE_PLAN"
          --environment "$FACTORY_INPUT_ENVIRONMENT"
          --ci "$FACTORY_INPUT_CI"
          --artifacts-root "$FACTORY_ACCEPTANCE_ROOT"
          --evidence "evidence-manifest.yaml"
          --candidate-sha "$FACTORY_INPUT_CANDIDATE_SHA"
          --acceptance-run-id "$FACTORY_INPUT_ACCEPTANCE_RUN_ID"
          --acceptance-attestation "$FACTORY_ACCEPTANCE_ATTESTATION"
          --repository "$GITHUB_REPOSITORY"
          --out "$FACTORY_RELEASE_ROOT" --json
      - name: Upload controller-derived release envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-release-envelope-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-release-envelope
          if-no-files-found: error
          retention-days: ${{ steps.contract.outputs.retention_days }}
