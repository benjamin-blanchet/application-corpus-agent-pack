# Loaded from the protected base. Candidate files are data only: this workflow
# never executes candidate scripts, dependencies or declared CI operations.
name: Factory policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: factory-policy-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FACTORY_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
      FACTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      FACTORY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.FACTORY_CONTROLLER_SHA }}
          path: factory-controller
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact published base as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: published-base
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Bind protected controller and exact candidate
        id: contracts-context
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-workflow-context.mjs"
          --controller-root "$GITHUB_WORKSPACE/factory-controller"
          --controller-sha "$FACTORY_CONTROLLER_SHA"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --candidate-sha "$FACTORY_CANDIDATE_SHA"
          --json
      - name: Pack-owned Factory compatibility suite
        id: suite
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/test-factory-suite.mjs"
          --subject-root "$GITHUB_WORKSPACE/candidate"
          --baseline-root "$GITHUB_WORKSPACE/published-base"
          --baseline-sha "$FACTORY_BASE_SHA"
      - name: Factory state and plans
        id: factory
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/validate-factory.mjs"
          --root "$GITHUB_WORKSPACE/candidate"
          --json
      - name: Delivery templates
        id: delivery-templates
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/validate-delivery.mjs"
          --root "$GITHUB_WORKSPACE/candidate"
          --lint-template
          --allow-unadopted-workflows
          --json
      - name: Real delivery package fixture
        id: delivery-package
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/validate-delivery.mjs"
          --root "$GITHUB_WORKSPACE/candidate"
          --package scripts/fixtures/factory-delivery
          --environment scripts/fixtures/factory-delivery/environment.yaml
          --ci scripts/fixtures/factory-delivery/ci.yaml
          --allow-unadopted-workflows
          --json
      - name: Corpus
        id: corpus
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/validate-corpus.mjs"
          --root "$GITHUB_WORKSPACE/candidate"
          --json
