version: 1
provider: github
repository: <github-owner>/<github-repository>
draft: true
title: <ticket> - <observable outcome>
base_ref: <approved-base-branch>
head_ref_from: FACTORY_HEAD_REF
body_path: doc/spec/<version>/<ticket>/PR_DESCRIPTION.md
spec_ref: doc/spec/<version>/<ticket>/SPECIFICATION.md
factory_plan_ref: doc/spec/<version>/<ticket>/factory/plan.v3.json
acceptance_matrix_ref: doc/spec/<version>/<ticket>/acceptance-plan.yaml
environment_contract_ref: doc/project/runtime/ENVIRONMENTS.yaml
ci_contract_ref: doc/project/cicd/FACTORY_CI.yaml
replay_command: "FACTORY_SUBJECT_SHA=<candidate-sha> FACTORY_RUN_ID=<run-id> node scripts/factory-acceptance.mjs --plan doc/spec/<version>/<ticket>/acceptance-plan.yaml --environment doc/project/runtime/ENVIRONMENTS.yaml --ci doc/project/cicd/FACTORY_CI.yaml --subject-sha $FACTORY_SUBJECT_SHA --run-id $FACTORY_RUN_ID --observation-out <run-observation> --evidence-root <run-directory>"
required_checks: [factory-policy, factory-application-ci]
ci_attestation:
  provider: github_actions
  workflow_ref: .github/workflows/factory-acceptance.yml
  event: repository_dispatch
  artifact_name_prefix: factory-evidence-bundle-
authorization:
  required: true
  provider: external_receipt
  issuer_ref: <external-gate-issuer>
  gate_id: draft-pr
  public_key_ref: <external-gate-public-key-path>
  max_age_minutes: 60
permissions:
  actions: read
  contents: read
  checks: read
  pull_requests: write
forbidden_actions: [push, approve, mark_ready, merge, force_push]
