name: Factory draft PR

on:
  repository_dispatch:
    types: [factory-draft-pr]

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: factory-draft-pr-${{ github.event.client_payload.head_ref }}
  cancel-in-progress: false

jobs:
  draft-pr:
    # A false condition here skips the job, and GitHub reports a run whose
    # jobs were all skipped as `conclusion: success`. That is safe only
    # because every verifier of this run now also requires that at least one
    # job actually executed (assertRunExecutedAJob). Do not weaken that check
    # and leave this guard as the only one: a green run that ran nothing
    # would attest a release.
    if: ${{ github.sha == vars.FACTORY_CONTROLLER_SHA }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: factory-delivery
    env:
      FACTORY_INPUT_CONTRACT: ${{ github.event.client_payload.contract }}
      FACTORY_INPUT_ACCEPTANCE_PLAN: ${{ github.event.client_payload.acceptance_plan }}
      FACTORY_INPUT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
      FACTORY_INPUT_CI: ${{ github.event.client_payload.ci }}
      FACTORY_INPUT_ACCEPTANCE_RUN_ID: ${{ github.event.client_payload.acceptance_run_id }}
      FACTORY_INPUT_RELEASE_RUN_ID: ${{ github.event.client_payload.release_run_id }}
      FACTORY_INPUT_HEAD_REF: ${{ github.event.client_payload.head_ref }}
      FACTORY_INPUT_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
      FACTORY_INPUT_BASE_REF: ${{ github.event.client_payload.base_ref }}
      FACTORY_EVIDENCE_ROOT: ${{ runner.temp }}/factory-evidence
    steps:
      - name: Checkout protected factory controller and trust root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.FACTORY_CONTROLLER_SHA }}
          path: factory-controller
          persist-credentials: false
      - name: Checkout exact authorized head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Validate protected controller and candidate checkouts
        env:
          FACTORY_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-workflow-context.mjs"
          --controller-root "$GITHUB_WORKSPACE/factory-controller"
          --controller-sha "$FACTORY_CONTROLLER_SHA"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --candidate-sha "$FACTORY_INPUT_HEAD_SHA" --json
      - name: Download immutable minimized evidence bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-evidence-bundle-${{ github.event.client_payload.acceptance_run_id }}
          path: ${{ runner.temp }}/factory-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.acceptance_run_id }}
      - name: Download manifest and report envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-evidence-envelope-${{ github.event.client_payload.acceptance_run_id }}
          path: ${{ runner.temp }}/factory-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.acceptance_run_id }}
      - name: Download controller-derived release-ready envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-release-envelope-${{ github.event.client_payload.release_run_id }}
          path: ${{ runner.temp }}/factory-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.release_run_id }}
      - name: Materialize signed external authorization receipt
        env:
          FACTORY_AUTHORIZATION_RECEIPT: ${{ github.event.client_payload.authorization_receipt_json }}
        run: node -e "const fs=require('node:fs'); JSON.parse(process.env.FACTORY_AUTHORIZATION_RECEIPT); fs.writeFileSync(process.env.RUNNER_TEMP + '/factory-authorization-receipt.json', process.env.FACTORY_AUTHORIZATION_RECEIPT + '\n', {encoding:'utf8',mode:0o600});"
      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_AUTHORIZATION_PUBLIC_KEY_PATH: ${{ vars.FACTORY_AUTHORIZATION_PUBLIC_KEY_PATH }}
          FACTORY_RELEASE_CONTROLLER_SHA: ${{ vars.FACTORY_CONTROLLER_SHA }}
        run: >-
          node "$GITHUB_WORKSPACE/factory-controller/scripts/factory-pr.mjs" --execute
          --root "$GITHUB_WORKSPACE/candidate"
          --trust-root "$GITHUB_WORKSPACE/factory-controller"
          --authorization-public-key "$FACTORY_AUTHORIZATION_PUBLIC_KEY_PATH"
          --contract "$FACTORY_INPUT_CONTRACT"
          --evidence "$FACTORY_EVIDENCE_ROOT/evidence-manifest.yaml"
          --plan "$FACTORY_INPUT_ACCEPTANCE_PLAN"
          --environment "$FACTORY_INPUT_ENVIRONMENT"
          --ci "$FACTORY_INPUT_CI"
          --artifacts-root "$FACTORY_EVIDENCE_ROOT"
          --factory-events "$FACTORY_EVIDENCE_ROOT/events.v3.jsonl"
          --factory-state "$FACTORY_EVIDENCE_ROOT/state.v3.json"
          --release-metadata "$FACTORY_EVIDENCE_ROOT/release-envelope.json"
          --release-run-id "$FACTORY_INPUT_RELEASE_RUN_ID"
          --release-controller-sha "$FACTORY_RELEASE_CONTROLLER_SHA"
          --acceptance-run-id "$FACTORY_INPUT_ACCEPTANCE_RUN_ID"
          --head-ref "$FACTORY_INPUT_HEAD_REF"
          --head-sha "$FACTORY_INPUT_HEAD_SHA"
          --base-ref "$FACTORY_INPUT_BASE_REF"
          --authorization-receipt "$RUNNER_TEMP/factory-authorization-receipt.json" --json
