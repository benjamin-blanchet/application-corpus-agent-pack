name: Factory draft PR

on:
  workflow_dispatch:
    inputs:
      contract:
        description: Repository-relative pr-draft.yaml path
        required: true
      evidence:
        description: Repository-relative evidence manifest path
        required: true
      acceptance_plan:
        description: Repository-relative acceptance plan path
        required: true
      environment:
        description: Repository-relative environment contract path
        required: true
      ci:
        description: Repository-relative factory CI contract path
        required: true
      artifacts_root:
        description: Repository-relative evidence artifact root
        required: true
      head_ref:
        description: Existing remote head branch
        required: true
      head_sha:
        description: Full SHA that was tested and must be at head_ref
        required: true
      base_ref:
        description: Target base branch
        required: true
      authorization_receipt_json:
        description: External authorization receipt JSON bound to this operation
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: factory-draft-pr-${{ github.event.inputs.head_ref }}
  cancel-in-progress: false

jobs:
  draft-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Validate delivery package
        run: node scripts/validate-delivery.mjs --package "$(dirname "${{ github.event.inputs.acceptance_plan }}")" --environment "${{ github.event.inputs.environment }}" --ci "${{ github.event.inputs.ci }}" --json

      - name: Materialize external authorization receipt
        env:
          FACTORY_AUTHORIZATION_RECEIPT: ${{ github.event.inputs.authorization_receipt_json }}
        run: node -e "const fs=require('node:fs'); const p=process.env.RUNNER_TEMP + '/factory-authorization-receipt.json'; JSON.parse(process.env.FACTORY_AUTHORIZATION_RECEIPT); fs.writeFileSync(p, process.env.FACTORY_AUTHORIZATION_RECEIPT + '\n', 'utf8');"

      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/factory-pr.mjs --execute --contract "${{ github.event.inputs.contract }}" --evidence "${{ github.event.inputs.evidence }}" --plan "${{ github.event.inputs.acceptance_plan }}" --environment "${{ github.event.inputs.environment }}" --ci "${{ github.event.inputs.ci }}" --artifacts-root "${{ github.event.inputs.artifacts_root }}" --head-ref "${{ github.event.inputs.head_ref }}" --head-sha "${{ github.event.inputs.head_sha }}" --base-ref "${{ github.event.inputs.base_ref }}" --authorization-receipt "$RUNNER_TEMP/factory-authorization-receipt.json" --json
