# The factory's guarantees are written in skills, and a skill is read by a
# model when it happens to. This workflow is what makes them hold when nobody
# is reading.
name: Factory policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      # One command owns the complete pack regression matrix. A narrow validator
      # self-test is not evidence that the factory package still composes.
      - name: Complete pack test suite
        run: npm test

      - name: Factory state and plans
        run: node scripts/validate-factory.mjs

      - name: Delivery templates
        run: node scripts/validate-delivery.mjs --lint-template --json

      - name: Real delivery package fixture
        run: node scripts/validate-delivery.mjs --package scripts/fixtures/factory-delivery --environment scripts/fixtures/factory-delivery/environment.yaml --ci scripts/fixtures/factory-delivery/ci.yaml --json

      - name: Corpus
        run: node scripts/validate-corpus.mjs --json

      - name: Preserve factory manifests for this exact head
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-policy-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            doc/spec/**/factory/state.v3.json
            doc/spec/**/factory/evidence-manifest.v3.json
          if-no-files-found: ignore
          retention-days: 30

# Adoption gate: run this workflow on a real draft PR and configure the exact
# `Factory policy / validate` check as required before relying on it. A workflow
# that never triggers is not a green gate. Protected acceptance and draft-PR
# delivery use separate identities/workflows; this policy has read-only content
# permission and receives no application secrets.
