name: Factory ordinary CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-ordinary-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application CI / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Run declared application CI
        run: >-
          node scripts/factory-ci-check.mjs
          --root .
          --ci doc/project/cicd/FACTORY_CI.yaml
          --check factory-application-ci
          --json

  delivery-contract:
    name: Factory delivery / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Validate declared Delivery contracts
        run: >-
          node scripts/factory-ci-check.mjs
          --root .
          --ci doc/project/cicd/FACTORY_CI.yaml
          --check factory-delivery-validation
          --json
