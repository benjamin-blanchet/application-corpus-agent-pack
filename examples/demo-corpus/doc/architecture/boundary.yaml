version: 1
app:
  id: orders-service
  name: Orders Service
  repo: acme/orders-service
interfaces:
  inbound:
    - id: in-create-order
      kind: sync-api
      protocol: rest
      channel: "POST /v1/orders"
      from: [external:web-bff]
      entities: [Order]
      criticality: critical
      confidence: confirmed
      source: code
      evidence: ["src/api/OrderController.java:48"]
    - id: in-payment-captured
      kind: async-consume
      protocol: kafka
      channel: "payments.captured"
      from: [payments-service]
      entities: [Payment]
      criticality: high
      confidence: confirmed
      source: code
      evidence: ["src/msg/PaymentCapturedConsumer.java:21"]
  outbound:
    - id: out-charge
      kind: sync-call
      protocol: rest
      channel: "POST /v1/charge"
      to: [payments-service]
      entities: [Payment]
      criticality: critical
      confidence: confirmed
      source: code
      evidence: ["src/infra/PaymentsClient.java:33"]
    - id: out-order-created
      kind: async-produce
      protocol: kafka
      channel: "orders.created"
      to: [shipping-service, billing-service]
      entities: [Order]
      criticality: high
      confidence: confirmed
      source: code
      evidence: ["src/infra/OrderEventPublisher.java:57"]
