# Code Analysis Pipeline State
#
# Tracks the 9-pass deep code analysis pipeline (P1 → P9).
# Each pass is owned by its skill (50 → 58) and must reach status: covered
# in order. P9 final gate flips overall_status to covered, which is required
# before adoption guide material.
#
# Status values (from governance/discovery-coverage-contract):
#   not_started | inventory_only | started | partial | covered | deep | blocked | not_applicable

pipeline:
  overall_status: not_started
  last_run: null
  p1_tree_inventory:
    status: not_started
    last_run: null
    files_inventoried: 0
    unread_directories: 0
    unknown_files: 0
    blocks_next_pass: true
  p2_logical_boundaries:
