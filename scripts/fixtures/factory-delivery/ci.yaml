version: 1
subject_revision: pull_request_head
pipeline:
  active_config_ref: .github/workflows/factory-policy.yml
  candidate_build_operation: fixture-build
  preview_mode: local
  preview_operation: fixture-start
  build_identity_operation: fixture-revision
operations:
  fixture-policy:
    argv: [node, scripts/validate-delivery.mjs]
    cwd: .
    timeout_seconds: 120
    privilege: unprivileged
    side_effect: none
  fixture-health:
    argv: [node, -e, "console.log('healthy')"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: none
  fixture-build:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: build
  fixture-start:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: start
  fixture-stop:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: stop
  fixture-reset:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: reset
  fixture-revision:
    argv: [node, -e, "console.log('aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: none
  fixture-schema:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: none
  fixture-dataset:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: none
  fixture-credential:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: none
  fixture-cleanup:
    argv: [node, -e, "process.exit(0)"]
    cwd: .
    timeout_seconds: 30
    privilege: unprivileged
    side_effect: cleanup
  fixture-acceptance:
    argv: [node, scripts/adapters/playwright/run.mjs, --plan, scripts/fixtures/factory-delivery/acceptance-plan.yaml, --environment, scripts/fixtures/factory-delivery/environment.yaml, --ci, scripts/fixtures/factory-delivery/ci.yaml, --observation, scripts/fixtures/factory-delivery/observation.json, --config, .github/templates/software-factory/acceptance/playwright.config.mjs, --subject-sha, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, --run-id, fixture-run-001]
    cwd: .
    timeout_seconds: 1800
    privilege: protected_environment
    side_effect: none
checks:
  - id: factory-policy
    provider_name: factory-policy
    operation: fixture-policy
    required: true
    secret_access: none
  - id: factory-application-ci
    provider_name: application-ci
    operation: fixture-build
    required: true
    secret_access: none
  - id: factory-acceptance
    provider_name: factory-acceptance
    operation: fixture-acceptance
    required: false
    environment_profile: fixture-local
    secret_access: none
artifacts:
  retention_days: 30
  required: [evidence-manifest, results-json, junit, acceptance-report]
  conditional: [screenshots]
flake_policy:
  retry_count: 1
  retry_pass_outcome: failed
  retry_reason: flaky_retry
  flaky_blocks_readiness: true
security:
  default_permissions: read
  protected_job_requires_environment_approval: true
  policy_definition_source: protected_base
  controller_ref: protected_full_sha
  candidate_checkout_credentials: none
  actions_pinned_to_full_sha: true
