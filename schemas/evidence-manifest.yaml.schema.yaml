# Schema for generated delivery evidence. This file is generated from results;
# it is never an author-written assertion of success.
file_pattern: doc/spec/*/*/acceptance/runs/*/evidence-manifest.yaml
written_by_skill: development/factory-evidence
description: |
  Immutable run provenance, environment fingerprint, case outcomes, mutation
  cleanup, and content hashes for every evidence artifact.
must_not_be_markdown: true
root:
  required_keys: [schema_version, run_id, generated_at, spec_package, subject, environment, toolchain, acceptance, publication, criteria_waivers, cases, mutations, artifacts, summary, verdict]
case:
  required_keys: [id, criteria, outcome, attempts, oracle_results, evidence_ids, evidence_bindings]
  optional_keys: [reason, waiver]
  enums:
    outcome: [passed, failed, blocked, skipped, waived]
mutation:
  required_keys: [id, outcome, cleanup]
  enums:
    outcome: [applied, not_applied, failed]
    cleanup: [passed, failed, pending, not_required]
artifact:
  required_keys: [id, path, media_type, sha256, bytes]
subject:
  required_keys: [head_sha, tested_sha, source_tree_digest]
  optional_keys: [base_sha, evidence_commit_sha]
acceptance:
  required_keys: [plan_path, plan_digest]
publication:
  required_keys: [mode]
  enums:
    mode: [ci_artifact, evidence_only_commit]
  conditional: evidence_only_commit requires subject.evidence_commit_sha; ci_artifact does not
ci_artifact_publication:
  required_keys: [ci_run_id, artifact_id, artifact_url, retention_days, bundle_digest]
evidence_binding:
  required_keys: [requirement_id, artifact_id, type, checkpoint]
waiver:
  required_keys: [reason, approver_ref, approved_at]
criterion_waiver:
  required_keys: [criterion_id, reason, approver_ref, approved_at]
verdict: [ready, blocked]
