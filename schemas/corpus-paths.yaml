patterns:
  - id: known-bug
    glob: doc/prod/known-bugs/BUG-<id>-<slug>.md
    regex: '^doc/prod/known-bugs/BUG-[0-9]{3}-[a-z0-9-]+\.md$'
    produced_by: authoring/knowledge-capture
  - id: structural-risk
    glob: doc/prod/structural-risks/RISK-<id>-<slug>.md
    regex: '^doc/prod/structural-risks/RISK-[0-9]{3}-[a-z0-9-]+\.md$'
    produced_by: pipeline/p7-structural-issues
  - id: root-cause-playbook
    glob: doc/prod/root-cause-playbooks/PLAYBOOK-<slug>.md
    regex: '^doc/prod/root-cause-playbooks/PLAYBOOK-[a-z0-9-]+\.md$'
    produced_by: authoring/analyze-incident
  - id: watchlist
    glob: doc/prod/watchlist/WATCH-<slug>.md
    regex: '^doc/prod/watchlist/WATCH-[a-z0-9-]+\.md$'
    produced_by: reliability
  - id: feature-folder
    glob: doc/project/features/<slug>/{README,ARCHITECTURE,WORKFLOWS,BUSINESS_RULES,OPERATIONS,AI_AGENT_GUIDE}.md
    regex: '^doc/project/features/[a-z0-9-]+/(README|ARCHITECTURE|WORKFLOWS|BUSINESS_RULES|OPERATIONS|AI_AGENT_GUIDE)\.md$'
    produced_by: pipeline/p4-feature-silo-deep-dive
  - id: code-interview
    glob: doc/_meta/code-interview/<slug>.md
    regex: '^doc/_meta/code-interview/[a-z0-9-]+\.md$'
    produced_by: pipeline/per-brick-interview
