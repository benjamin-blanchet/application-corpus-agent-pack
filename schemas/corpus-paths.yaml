# corpus-paths.yaml — SINGLE SOURCE OF TRUTH for canonical corpus file paths.
# Consumers MUST read this instead of hardcoding paths:
#   scripts/validate-corpus.mjs   -> hard-gate `gated: true`; near-miss detect deviations
#   scripts/build-corpus-site.mjs -> read `surfaced: true`
#   pipeline/authoring skills      -> cross-reference the canonical path (never invent variants)
# Fields:
#   requirement: required | conditional   (conditional = only when that subject exists)
#   delivery:    skeleton (shipped) | llm-created (agent writes it) | generated (produced at handover)
#   gated:       true | false | conditional   (validator presence gate)
#   surfaced:    dashboard reads it
#   scaffold:    ship an empty stub so the agent fills, never names
version: 1
