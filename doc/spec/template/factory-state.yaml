# Current execution state for one change.
#
# TECHNICAL_PLAN.md carries the rationale, technical-plan.yaml the plan,
# this file the state. JOURNAL.md carries the immutable history.
#
# The point of this file is that "what can we ship?" stops being an
# investigation across tickets, branches, mail threads and memory, and becomes
# a query across these files.

version: 1

# specification_pending_approval | tip_pending_approval | implementing
# | integrated | reviewed | closed_out | acceptance | release_ready
state: specification_pending_approval

spec:
  status: pending          # pending | approved
  approved_by: null
  approved_at: null

technical_plan:
  status: pending
  approved_by: null
  approved_at: null

execution_policy:
  mode: pending
  catalogue_observed_at: null
  advanced_model: runtime-selection-required
  bounded_implementation_model: runtime-selection-required
  reviewer_model: runtime-selection-required

gates:
  implementation: pending
  consolidated_review: pending
  corpus_closeout: pending
  acceptance: pending
  final_release_readiness: pending

# `not_applicable` is a legitimate acceptance outcome for a change with no
# executable behaviour, but it is an operator decision with a written reason,
# never a default.
acceptance_not_applicable_reason: null
acceptance_not_applicable_approved_by: null
acceptance_not_applicable_approved_at: null

lots:
  LOT-1:
    status: pending        # pending | running | completed | escalated
    model_planned: bounded_implementation
    model_requested: null
    model_used: null

# Provenance chain. Each link is what makes the next one meaningful:
# a proof is only a proof of the revision it was produced against.
tested_code_sha: null
evidence_commit_sha: null
