# Machine-readable execution plan for one change.
#
# Written after human approval of the specification, alongside
# TECHNICAL_PLAN.md (the human-readable rationale) and factory-state.yaml
# (the current execution state).
#
# Stack-neutral by construction: paths, verification commands and model
# identities are filled per application. The pack defines the shape, the
# corpus supplies the answers.

version: 1
spec: doc/spec/<version>/<ticket>/SPECIFICATION.md

# Execution mode chosen by the operator at preflight.
#   balanced | maximum_quality | economical | manual
mode: pending

# Model identities are resolved from the runtime catalogue at task start and
# recorded here as task state. They are never permanent defaults: a model named
# in a repository file is a historical fact, not an availability claim.
model_roles:
  advanced:
    selected: runtime-selection-required
    resolved_at: null
  bounded_implementation:
    selected: runtime-selection-required
    resolved_at: null
  reviewer:
    selected: runtime-selection-required
    resolved_at: null
    # The reviewer must not come from the same model family as the author.
    # Self-preference is measured and mechanistic, not theoretical.
    distinct_family_from_author: true

# Where this decomposition came from. A recipe is a deterministic program that
# runs once; a freehand partition is an inference that resolves differently
# every time. Recipes are mined from what the repository actually did.
derived_from_recipe: null    # <axis>/<technology>/recipes/<id>, or null
recipe_candidate: false      # true when this partition should become one

# Every approved acceptance criterion, by ID, bound to what will prove it.
# A criterion with no journey is a coverage gap the tooling can see, rather
# than one a human has to remember.
acceptance_criteria: []
  # - id: AC1
  #   proven_by: <test case id>              # or:
  #   not_observable: <why>

lots:
  - id: LOT-1
    objective: <observable technical outcome>
    acceptance_criteria: []
    technical_scopes: []
    # Exclusive for this lot's wave. Two lots may run in the same wave only if
    # their owned path sets are disjoint.
    allowed_paths: []
    forbidden_paths: []
    dependencies: []
    contracts:
      inputs: []
      outputs: []
      invariants: []
      non_goals: []
    risk: medium            # low | medium | high
    complexity: bounded     # bounded | reasoning
    model_role: bounded_implementation
    # How this lot is proven done, deterministically. Names how the
    # application is actually built and checked rather than improvising a
    # command list per change. A lot whose verification cannot be expressed is
    # telling you the change is not observable yet — cheapest to find here.
    verification: []
    max_attempts: 2

# Reviewer capacity is a first-order constraint. Generating changes faster than
# they can be reviewed converts a delivery gain into a queue — the documented
# failure mode of every spec-driven pipeline that has published numbers.
# A gate, not a field. A change whose review cost exceeds the capacity left in
# the period waits, is split, or the operator explicitly accepts the queue.
review_budget:
  expected_diff_lines: null
  expected_review_effort: null
  reviewers: []              # named by code ownership, not by availability
  capacity_remaining: null
  exceeds_capacity: false
  operator_accepted_queue: false
