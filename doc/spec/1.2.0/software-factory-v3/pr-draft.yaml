version: 1
provider: github
repository: benjamin-blanchet/application-corpus-agent-pack
draft: true
title: Software Factory V3
base_ref: main
head_ref_from: FACTORY_HEAD_REF
body_path: doc/spec/1.2.0/software-factory-v3/PR_DESCRIPTION.md
spec_ref: doc/spec/1.2.0/software-factory-v3/SPECIFICATION.md
factory_plan_ref: doc/spec/1.2.0/software-factory-v3/factory/plan.v3.json
acceptance_matrix_ref: doc/spec/1.2.0/software-factory-v3/acceptance-plan.yaml
environment_contract_ref: doc/project/runtime/ENVIRONMENTS.yaml
ci_contract_ref: doc/project/cicd/FACTORY_CI.yaml
replay_command: "node scripts/factory-acceptance.mjs --plan doc/spec/1.2.0/software-factory-v3/acceptance-plan.yaml --environment doc/project/runtime/ENVIRONMENTS.yaml --ci doc/project/cicd/FACTORY_CI.yaml --subject-sha $FACTORY_SUBJECT_SHA --run-id $FACTORY_RUN_ID --observation-out factory-observation.json --lifecycle-out factory-lifecycle.json --evidence-root factory-evidence"
required_checks: [factory-policy, factory-application-ci, factory-delivery-validation]
ci_attestation:
  provider: github_actions
  workflow_ref: .github/workflows/factory-acceptance.yml
  event: repository_dispatch
  artifact_name_prefix: factory-evidence-bundle-
authorization:
  required: true
  provider: external_receipt
  issuer_ref: pack-dogfood-gate
  gate_id: draft-pr
  public_key_ref: scripts/fixtures/factory-delivery/delivery-public-key.pem
  max_age_minutes: 60
permissions:
  actions: read
  contents: read
  checks: read
  pull_requests: write
forbidden_actions: [push, approve, mark_ready, merge, force_push]
