# This profile declares application identity, consent and durable mappings.
# Source contracts live in information-sources.yaml; historical evidence lives
# in source-coverage.yaml; current runtime capability is probed per run and is
# never stored here.
application:
  name: unknown
  description: unknown
  business_domain: unknown
  repository:
    name: unknown
    role: primary
    url: unknown
    primary_repository: unknown
  multi_repo:
    status: not_started
    role: unknown
    workspace_root: unknown
    last_interview: null
    read_sibling_code: false
    read_sibling_corpus: false
    read_external_corpus: false
    sync_policy: agent-suggested
    adjacent_repos: []
    consumed_by: []
  languages: []
  frameworks: []
  runtimes: []
  build_tools: []
  package_managers: []
  deployment:
    type: unknown
    environments: []
  data_stores: []
  external_systems: []
  observability:
    logs: unknown
    metrics: unknown
    traces: unknown
    apm: []
  source_control:
    provider: unknown
    default_branch: unknown
  work_tracking:
    provider: unknown
    project_keys: []
  documentation_sources:
    confluence_spaces: []
    other: []
  language_policy:
    corpus: en
    team_outputs: fr
notes:
- This file must be filled from repository evidence, connected sources, or human confirmation.
  Do not assume a stack.
- The `application.multi_repo` block is populated by skill `foundations/multi-repo-workspace-detection`
  at the very start of the kickstart. Do not edit it by hand — re-run the skill instead
  so corpus-state.yaml stays in sync.
- `adjacent_repos` is non-empty only when `multi_repo.role` is `primary` or `sibling-app`.
- `consumed_by` is non-empty only when `multi_repo.role` is `library` or `secondary`.
- Each `adjacent_repos[]` / `consumed_by[]` entry carries a `source:` block:
  `{type: path, path}` for a workspace sibling, or
  `{type: git, host, url, owner, repo, ref, surface, cache_path, last_synced_sha, last_synced_at}`
  for a remote peer (the agent fills `cache_path`/`last_synced_*` after each sync).
  Other fields: `{name, app_id, role, access, corpus_path, has_pack, refresh_policy, consumed_for: []}`.
  Set `corpus_path: null` (not omitted) when `has_pack: false`.
- `name` is the local `.corpus-cache/` slug; `app_id` is the CANONICAL ecosystem
  identity (== the peer's `architecture/boundary.yaml` `app.id` == its
  `ecosystem-map.yaml` `id`). `app_id` is the cross-app join key; keep it in sync
  with the registry. This app's own canonical id lives in `architecture/boundary.yaml`.
- `access` (default `auto`) selects how a peer is reached:
  `auto | workspace | github-mcp | clone`. Actual access is performed by skill
  `sources/peer-corpus-access`; reading peers via the GitHub MCP requires the
  `read_external_corpus` consent flag above and a successful point-in-time
  `sources/runtime-source-probe`. Never store tokens/credentials here.
source_control:
  provider: unknown
  default_branch: unknown
  repository_url: unknown
  ticket_key_patterns: []
work_tracking:
  provider: unknown
  project_keys: []
  boards: []
  active_versions: []
  issue_types: []
ci_cd:
  provider: unknown
  pipelines: []
information_sources:
  registry: doc/_meta/information-sources.yaml
  custom_sources_enabled: true
  default_access_mode: read-only
safety_policy:
  default_mode: read-only
  destructive_actions_allowed: false
  require_explicit_human_approval_for_high_risk_actions: true
