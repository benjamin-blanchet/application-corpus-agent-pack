notes:
- This file must be filled from repository evidence, connected sources, or human confirmation.
  Do not assume a stack.
- The `application.multi_repo` block is populated by skill `foundations/multi-repo-workspace-detection`
  at the very start of the kickstart. Do not edit it by hand — re-run the skill instead
  so corpus-state.yaml stays in sync.
- `adjacent_repos` is non-empty only when `multi_repo.role` is `primary` or `sibling-app`.
- `consumed_by` is non-empty only when `multi_repo.role` is `library` or `secondary`.
- Each `adjacent_repos[]` / `consumed_by[]` entry uses the shape:
  `{name, role, relative_path, corpus_path, has_pack, consumed_for: []}`.
  Set `corpus_path: null` (not omitted) when `has_pack: false`.
